specVersion: 0.0.2
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: FortunasToken
    network: rinkeby
    source:
      address: "0x3b52931C60C1d77F7cfA05a060F638458445dda9"
      abi: FortunasToken
      startBlock: 10935201
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.5
      language: wasm/assemblyscript
      entities:
        - Approval
        - ExcludeFromFees
        - ExcludeMultipleAccountsFromFees
        - LedgerClaimed
        - LedgerCreated
        - LedgerUpdated
        - LiquidityWalletUpdated
        - OwnershipTransferred
        - SetAutomatedMarketMakerPair
        - SwapAndLiquify
        - Transfer
        - TreasuryWalletUpdated
        - UpdatePancakeRouter
      abis:
        - name: FortunasToken
          file: ./abis/FortunasToken.json
      eventHandlers:
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
        - event: ExcludeFromFees(indexed address,bool)
          handler: handleExcludeFromFees
        - event: ExcludeMultipleAccountsFromFees(address[],bool)
          handler: handleExcludeMultipleAccountsFromFees
        - event: LedgerClaimed(indexed address,uint256,uint256)
          handler: handleLedgerClaimed
        - event: LedgerCreated(indexed address,uint256,uint256)
          handler: handleLedgerCreated
        - event: LedgerUpdated(indexed address,uint256,uint256)
          handler: handleLedgerUpdated
        - event: LiquidityWalletUpdated(indexed address,indexed address)
          handler: handleLiquidityWalletUpdated
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: SetAutomatedMarketMakerPair(indexed address,indexed bool)
          handler: handleSetAutomatedMarketMakerPair
        - event: SwapAndLiquify(uint256,uint256,uint256)
          handler: handleSwapAndLiquify
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: TreasuryWalletUpdated(indexed address,indexed address)
          handler: handleTreasuryWalletUpdated
        - event: UpdatePancakeRouter(indexed address,indexed address)
          handler: handleUpdatePancakeRouter
      file: ./src/mapping.ts
