specVersion: 0.0.2
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: Battling
    network: rinkeby
    source:
      address: "0x69548Adb16759852315E2C16C94b9a5228BA4F48"
      abi: Battling
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.5
      language: wasm/assemblyscript
      entities:
        - BattleEnd
        - BattleStart
        - BattleUpdate
        - CavalryStatus
        - HeroStatus
        - OwnershipTransferred
      abis:
        - name: Battling
          file: Battling\abis\Battling.json
      eventHandlers:
        - event: BattleEnd(indexed
            address,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleBattleEnd
        - event: BattleStart(indexed
            address,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleBattleStart
        - event: BattleUpdate(indexed
            address,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleBattleUpdate
        - event: CavalryStatus(indexed address,uint256,uint256)
          handler: handleCavalryStatus
        - event: HeroStatus(indexed address,uint256,uint256)
          handler: handleHeroStatus
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
      file: Battling\Battling.wasm
