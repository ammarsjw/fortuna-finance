type Transaction @entity {
  id: ID!
  timestamp: BigInt!
  blockNumber: BigInt!
  blockHash: Bytes!
  from: Bytes!
  to: Bytes
  value: BigInt!
  gasPrice: BigInt!
}

type BattleStarted @entity {
  id: ID!
  transaction: Transaction!
  user: Bytes!
  battleType: BigInt!
  battleStatus: Boolean!
  tokensStaked: BigInt!
  battleStartTime: BigInt!
  battleDurationInDays: BigInt!
  rewards: BigInt!
  rations: BigInt!
}

type BattleUpdated @entity {
  id: ID!
  transaction: Transaction!
  user: Bytes!
  battleType: BigInt!
  battleStatus: Boolean!
  tokensStaked: BigInt!
